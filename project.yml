# XcodeGen 설정. 클라우드 빌드(GitHub Actions)에서 이 파일로 Xcode 프로젝트를 만든다.
# 번들 ID를 바꾸려면 아래 APP_BUNDLE_ID 한 줄만 고치면 된다.
name: Splits8

options:
  bundleIdPrefix: com.exorenal
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    APP_BUNDLE_ID: com.exorenal.splits8
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  Splits8:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
      - path: Shared
      - path: Resources/iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/iOS/Splits8.entitlements
    info:
      path: Resources/iOS/Info.plist
      properties:
        CFBundleDisplayName: Splits8
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: 운동 기록과 심박수를 확인하기 위해 건강 데이터를 읽습니다.
        NSHealthUpdateUsageDescription: 운동 기록을 건강 앱에 저장합니다.
        NSPhotoLibraryAddUsageDescription: 공유 이미지를 사진 앱에 저장합니다.
        LSApplicationQueriesSchemes: [instagram-stories]
        NSLocationWhenInUseUsageDescription: 야외 러닝의 페이스와 거리를 재기 위해 위치를 사용합니다.
    entitlements:
      path: Resources/iOS/Splits8.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.applesignin: [Default]
    dependencies:
      - target: Splits8Watch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  Splits8Watch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Shared
      - path: Resources/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/Watch/Splits8Watch.entitlements
        SKIP_INSTALL: YES
    info:
      path: Resources/Watch/Info.plist
      properties:
        CFBundleDisplayName: Splits8
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: 운동 중 심박수와 칼로리를 측정하기 위해 건강 데이터를 읽습니다.
        NSHealthUpdateUsageDescription: 운동 기록을 건강 앱에 저장합니다.
        NSLocationWhenInUseUsageDescription: 야외 러닝의 페이스와 거리를 재기 위해 위치를 사용합니다.
    entitlements:
      path: Resources/Watch/Splits8Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  Splits8UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Splits8
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Splits8

schemes:
  Splits8:
    build:
      targets:
        Splits8: all
        Splits8Watch: all
    archive:
      config: Release
  Screenshots:
    build:
      targets:
        Splits8: all
        Splits8UITests: [test]
    test:
      targets:
        - Splits8UITests
      config: Debug
