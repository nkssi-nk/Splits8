# XcodeGen 설정. 클라우드 빌드(GitHub Actions)에서 이 파일로 Xcode 프로젝트를 만든다.
# 번들 ID를 바꾸려면 아래 APP_BUNDLE_ID 한 줄만 고치면 된다.
name: Splits8

options:
  bundleIdPrefix: com.nkssi
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en      # 기본 언어 영어 + 한국어 (Resources/*/ko.lproj)

settings:
  base:
    APP_BUNDLE_ID: com.nkssi.splits8
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  Splits8:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
      - path: Shared
      - path: Resources/iOS
        excludes: ["PrivacyInfo.xcprivacy"]
      # 개인정보 사용 명세 파일 (앱 묶음 안에 리소스로 들어가야 함)
      - path: Resources/iOS/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/iOS/Splits8.entitlements
    info:
      path: Resources/iOS/Info.plist
      properties:
        CFBundleDisplayName: Splits8
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBg
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # 권한 문구: 영어 기본, 한국어는 Resources/iOS/ko.lproj/InfoPlist.strings
        NSHealthShareUsageDescription: Splits8 reads Health data to show your workouts and heart rate.
        NSHealthUpdateUsageDescription: Splits8 saves your workouts to the Health app.
        NSPhotoLibraryAddUsageDescription: Splits8 saves share images to your photo library.
        LSApplicationQueriesSchemes: [instagram-stories]
        # 링크로 받은 트레이닝 열기: splits8://t?d=…  (홈페이지 t.html 의 "SPLITS8에서 열기" 버튼)
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [splits8]
        NSLocationWhenInUseUsageDescription: Splits8 uses your location to measure pace and distance on outdoor runs.
    entitlements:
      path: Resources/iOS/Splits8.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.applesignin: [Default]
    dependencies:
      - target: Splits8Watch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  Splits8Watch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Shared
      - path: Resources/Watch
        excludes: ["PrivacyInfo.xcprivacy"]
      - path: Resources/Watch/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/Watch/Splits8Watch.entitlements
        SKIP_INSTALL: YES
    info:
      path: Resources/Watch/Info.plist
      properties:
        CFBundleDisplayName: Splits8
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [workout-processing]
        # 권한 문구: 영어 기본, 한국어는 Resources/Watch/ko.lproj/InfoPlist.strings
        NSHealthShareUsageDescription: Splits8 reads Health data to measure heart rate and calories during workouts.
        NSHealthUpdateUsageDescription: Splits8 saves your workouts to the Health app.
        NSLocationWhenInUseUsageDescription: Splits8 uses your location to measure pace and distance on outdoor runs.
        NSMotionUsageDescription: Splits8 uses wrist motion to estimate stroke and rep counts during workouts.
    entitlements:
      path: Resources/Watch/Splits8Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  Splits8UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Splits8
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Splits8

schemes:
  Splits8:
    build:
      targets:
        Splits8: all
        Splits8Watch: all
    archive:
      config: Release
  Splits8Watch:
    build:
      targets:
        Splits8Watch: all
    archive:
      config: Release
  Screenshots:
    build:
      targets:
        Splits8: all
        Splits8UITests: [test]
    test:
      targets:
        - Splits8UITests
      config: Debug
