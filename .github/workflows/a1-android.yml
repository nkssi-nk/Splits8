# 안드로이드: android/ 폴더가 바뀔 때만 돕니다. (아이폰 빌드와 따로)
# 끝나면 아래 "Artifacts" 에서 splits8-android 내려받기 → 폰용 · 워치용 APK
name: A1. 안드로이드 빌드

on:
  push:
    paths: ['android/**', '.github/workflows/a1-android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 실행 권한 (윈도우에서 올리면 빠짐)
        run: chmod +x gradlew

      - name: 안드로이드 SDK 준비
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: 규칙 시험 (아이폰과 같은 값인지)
        run: ./gradlew :shared:testDebugUnitTest

      - name: 폰 · 워치 앱 빌드
        run: ./gradlew :app:assembleDebug :wear:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: splits8-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/wear/build/outputs/apk/debug/*.apk
